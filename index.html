    <!-- Fonts are self-hosted via @fontsource variables; no external font requests -->

    <!-- Theme guard: apply saved/system theme before paint to avoid FOUC -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("theme");
          var dark =
            stored === "dark" ||
            ((stored === null || stored === "system") &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) document.documentElement.classList.add("dark");
        } catch (e) {}
      })();
    </script>
